services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - ..:/workspace:cached
    command: sleep infinity
    ports:
      - "5173:5173" # Vite
      - "8080:8080" # Spring Boot
    depends_on:
      - db

  db:
    image: mysql:8
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: sys-dev-hq-app-1-db
    ports:
      - "3306:3306"
    volumes:
      - ../db/init:/docker-entrypoint-initdb.d
      - ../db/data:/var/lib/mysql
