# ===================================================================
# 本番環境用 Spring Boot 設定
# ===================================================================
# 使用方法: java -jar app.jar --spring.profiles.active=prod

# データベース接続（環境変数から取得することを推奨）
spring.datasource.url=${DATABASE_URL:jdbc:mysql://localhost:3306/sys-dev-hq-app-1-db?useSSL=true&allowPublicKeyRetrieval=true}
spring.datasource.username=${DATABASE_USERNAME:root}
spring.datasource.password=${DATABASE_PASSWORD:rootpassword}

# JWT設定（環境変数から取得すること）
jwt.secret=${JWT_SECRET:please-change-this-secret-key-in-production-environment-make-it-at-least-256-bits-long}
jwt.expiration=${JWT_EXPIRATION:86400000}

# Flyway設定
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=false
spring.flyway.validate-on-migrate=true
spring.flyway.locations=classpath:db/migration

# Hibernate設定（本番環境ではvalidateのみ、Flywayがスキーマを管理）
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false

# JPA Open-In-View警告を無効化
spring.jpa.open-in-view=false

# ログレベル
logging.level.root=INFO
logging.level.com.example.sysdevhqapp1backend=INFO
logging.level.org.springframework.security=WARN
logging.level.org.hibernate=WARN

# CORS設定（本番環境のフロントエンドURLに変更すること）
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://your-production-domain.com}

# サーバー設定
server.port=${PORT:8080}
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json
server.compression.min-response-size=1024

# セキュリティヘッダー
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=true
server.servlet.session.cookie.same-site=strict

# エラーページ
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
